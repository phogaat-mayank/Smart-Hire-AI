<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · Smart-Hire AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">
    <div id="tsparticles"></div>

    <div class="container py-4">
        <nav class="app-nav mb-4" aria-label="Auth navigation">
            <a class="brand-link" href="/">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Smart-Hire AI logo">
                <span>Smart-Hire AI</span>
            </a>
            <div class="nav-actions">
                <button id="themeToggle" class="btn btn-light nav-button theme-toggle" type="button"
                    aria-label="Toggle dark mode">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </nav>

        <div class="row justify-content-center align-items-center min-vh-75">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5" data-aos="fade-up">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="mb-4">
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi {{ 'bi-check-circle-fill' if category == 'success' else ('bi-info-circle-fill' if category == 'info' else 'bi-exclamation-triangle-fill') }} me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <div class="auth-card shadow-lg">
                    <div class="text-center mb-4">
                        <div class="auth-icon-badge mb-3">
                            <i class="bi bi-key-fill fs-1 text-primary"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Set New Password</h2>
                        <p class="text-muted">Enter a new secure password for <strong class="text-primary">{{ email }}</strong></p>
                    </div>

                    <form method="POST" action="/reset-password/{{ token }}" novalidate>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                    placeholder="At least 6 characters" required autocomplete="new-password" minlength="6" autofocus>
                                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="password" aria-label="Toggle password visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                    placeholder="Re-type your new password" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirm_password" aria-label="Toggle password visibility">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold auth-submit-btn">
                            <i class="bi bi-check2-circle me-2"></i> Update Password
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <p class="text-muted mb-0">Cancel and
                            <a href="/login" class="fw-semibold text-primary text-decoration-none">
                                return to Sign In
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
