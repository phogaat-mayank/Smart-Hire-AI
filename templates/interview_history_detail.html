<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Interview · Smart-Hire AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='history.css') }}">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="d-flex flex-wrap gap-2 mb-4">
            <a href="/interview-history" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i> Interview history</a>
            <form method="POST" action="/interview-history/{{ session.id }}/delete" onsubmit="return confirm('Delete this saved interview?')">
                <button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Delete</button>
            </form>
        </div>
        <div class="bg-white rounded-4 shadow-sm p-4 p-md-5">
            <p class="text-primary fw-semibold mb-1">SAVED INTERVIEW</p>
            <h1>{{ session.candidate.candidate_name }}</h1>
            <p class="text-muted mb-4">{{ session.created_at.strftime('%d %b %Y, %I:%M %p') }}</p>
            {% for answer in answers %}
            <article class="border-start border-4 border-primary bg-light rounded-end p-3 mb-3">
                <div class="d-flex justify-content-between gap-3 align-items-start"><h5>{{ loop.index }}. {{ answer.question }}</h5><span class="badge text-bg-primary text-capitalize">{{ answer.status }}</span></div>
                <p class="mb-2" style="white-space: pre-line">{{ answer.answer }}</p>
                <small class="text-muted"><strong>Resume evidence:</strong> {{ answer.evidence }}</small>
            </article>
            {% endfor %}
        </div>
    </main>
</body>
</html>
